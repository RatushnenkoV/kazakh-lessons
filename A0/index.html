<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Казахский A0 — Начальный уровень</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/a0.css" />
</head>
<body>

  <div class="a0-path-page">

    <!-- ── Header ── -->
    <div class="a0-path-header">
      <a href="../index.html" class="a0-back-link">← Главная</a>
      <div class="a0-path-title-wrap">
        <div class="a0-level-badge">A0</div>
        <div>
          <h1>Начальный уровень</h1>
          <p>Грамматика казахского языка с нуля</p>
        </div>
      </div>
      <div class="a0-path-stats" id="a0-stats"></div>
    </div>

    <!-- ── Lesson path ── -->
    <div class="a0-path-body">
      <div class="a0-path-list" id="a0-path-list">
        <!-- Rendered by path.js -->
        <div class="a0-loading">Загрузка уроков…</div>
      </div>

      <!-- Reset section -->
      <div class="a0-reset-section">
        <p class="a0-reset-label">Для сброса прогресса введи фразу ниже</p>
        <input type="text" id="reset-input" class="a0-reset-input"
               placeholder="Сбросить весь прогресс" autocomplete="off" spellcheck="false" />
        <button id="reset-confirm-btn" class="a0-reset-confirm-btn" style="display:none">🗑 Сбросить всё</button>
      </div>
    </div>

  </div>

  <!-- Floating review button (shown when unlearned words exist) -->
  <button class="a0-float-btn" id="review-btn" style="display:none" title="Повторить невыученные слова">
    📚
    <span class="a0-float-badge" id="review-badge">0</span>
  </button>

  <!-- Review modal -->
  <div class="a0-modal" id="review-modal" style="display:none">
    <div class="a0-modal-header">
      <h3>Повторение слов</h3>
      <button class="a0-modal-close" id="review-close">✕</button>
    </div>
    <div class="a0-modal-body" id="review-body"></div>
  </div>

  <script src="js/path.js"></script>
</body>
</html>
